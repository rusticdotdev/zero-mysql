name: Install release-plz
description: Install the rusticdotdev fork of release-plz, which adds the sync-changelog command.

runs:
  using: composite
  steps:
    - name: Set the release-plz revision
      shell: bash
      # Commit of https://github.com/rusticdotdev/release-plz to install.
      run: echo "RELEASE_PLZ_REV=f6116e8d71a3f7df2f26c579daa9cfcd480c3449" >> "$GITHUB_ENV"
    - name: Restore release-plz from cache
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/release-plz
        key: release-plz-${{ runner.os }}-${{ runner.arch }}-${{ env.RELEASE_PLZ_REV }}
    - name: Build release-plz
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cargo install release-plz \
          --git https://github.com/rusticdotdev/release-plz \
          --rev "${RELEASE_PLZ_REV}" \
          --locked
